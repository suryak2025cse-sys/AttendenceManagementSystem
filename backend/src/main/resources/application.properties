# Server Port
server.port=8080

# MySQL Database Configuration
# createDatabaseIfNotExist=true automatically creates school_management if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/school_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Meta WhatsApp Cloud API Configuration (Read from environment variables)
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:school_attendance_absent}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
